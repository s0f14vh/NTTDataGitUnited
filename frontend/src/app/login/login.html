<div class="login-container">
  <div class="login-card">
    <h2>TicketHub - Acceso</h2>
    <p>Introduce tus datos para comprar tus entradas</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="******">
      </div>

      @if (errorSignal()) {
        <p class="error-msg">{{ errorSignal() }}</p>
      }

      <button type="submit" [disabled]="loginForm.invalid">Entrar a la tienda</button>
    </form>
  </div>
</div>
